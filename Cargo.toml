[package]
name = "fumi-gpui"
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace]
members = ["crates/*"]

[dependencies]
fumi-core = { path = "crates/fumi-core" }
fumi-ui = { path = "crates/fumi-ui" }
fumi-editor = { path = "crates/fumi-editor" }
fumi-workspace = { path = "crates/fumi-workspace" }
fumi-sidebar = { path = "crates/fumi-sidebar" }
fumi-toolbar = { path = "crates/fumi-toolbar" }
fumi-settings = { path = "crates/fumi-settings" }
fumi-memos = { path = "crates/fumi-memos" }
fumi-publish = { path = "crates/fumi-publish" }
gpui = { package = "gpui-fast", version = "=0.1.13", default-features = false }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.13", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc = "0.2"
cocoa = "0.26"
libc = "0.2"

# Full debug info made target/debug 11G. Line tables keep file:line in
# backtraces and panics; set debug = true locally when stepping in lldb.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false
incremental = false

# gpui-fast-macos 0.1.13 calls Option::map_or_default, unstable on Rust 1.95.
# Three lines changed in vendor/gpui-fast-macos; drop this patch on Rust 1.99.
# ratex-gpui asks for gpui-pre; vendor/gpui-fast-compat/gpui-pre stands in for it
# and re-exports gpui-fast, so only one GPUI is built.
[patch.crates-io]
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-pre = { path = "vendor/gpui-fast-compat/gpui-pre" }
