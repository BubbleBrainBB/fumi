[package]
name = "fumi-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ratex-gpui = { version = "0.4", default-features = false }
objc = "0.2"
cocoa = "0.26"
libc = "0.2"
smallvec = "1"
sha2 = "0.10"

[profile.release]
debug = false
incremental = true

# gpui-pre-macos 0.3.11 calls Option::map_or_default, unstable on Rust 1.95.
# Three lines changed; drop this patch on Rust 1.99.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
