name: Fumi
options:
  bundleIdPrefix: com.notes
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.notes.app
    PRODUCT_NAME: Fumi
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2025 Dylan Deng"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  Fumi:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Fumi
        excludes:
          - "Resources/**"
      - path: Fumi/Resources/Assets.xcassets
      # The WeChat Article extension's renderer and themes (Tools/wechat-renderer).
      - path: Fumi/Resources/WeChat
        type: folder
      # The Xiaohongshu Cards extension's layout (cards.html/css/js).
      - path: Fumi/Resources/Xiaohongshu
        type: folder
    info:
      path: Fumi/Info.plist
      properties:
        CFBundleDisplayName: Fumi
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPhotoLibraryAddUsageDescription: Fumi adds the Xiaohongshu cards you export to Photos, so they reach your phone.
    settings:
      base:
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
