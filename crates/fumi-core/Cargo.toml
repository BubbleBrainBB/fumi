[package]
name = "fumi-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fumi's logic with no UI: notes, Markdown, sync, search. Must not depend on GPUI."

[dependencies]
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
