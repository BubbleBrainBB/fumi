[package]
name = "fumi-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fumi-core = { path = "../fumi-core" }
fumi-ui = { path = "../fumi-ui" }
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratex-gpui = { version = "0.4", default-features = false }
regex = "1"
objc = "0.2"
cocoa = "0.26"
libc = "0.2"
smallvec = "1"
sha2 = "0.10"
futures = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
