# ratex-gpui depends on `gpui-pre` ^0.3, so it would pull a second
# GPUI. This stands in for gpui-pre and re-exports gpui-fast, the way
# gpui-fast's own compat/gpui-pre does (that one is pinned at 0.3.9 and
# depends on gpui-fast by path).
[package]
name = "gpui-pre"
version = "0.3.11"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "gpui"
path = "lib.rs"

[dependencies]
gpui_fast = { package = "gpui-fast", version = "=0.1.13", default-features = false }
